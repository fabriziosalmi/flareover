name: deploy-smoke

# The deploy/ stack used to carry a caveat that it was "structurally validated
# but not yet run end-to-end in CI (no Docker there)" — and the thing it could
# not answer was the most basic one: does PowerDNS start and serve on a clean
# host, or does the gsqlite3 schema have to be loaded by hand first? ubuntu
# runners do have Docker, so the question is answerable.
#
# This brings up the two stateful services the migration cannot do without and
# asserts they work. It deliberately skips Caddy: that service builds a custom
# binary with xcaddy, which takes minutes and proves nothing about the question
# being asked here.

on:
  push:
    branches: [main]
    paths: ["deploy/**", ".github/workflows/deploy-smoke.yml"]
  pull_request:
    paths: ["deploy/**", ".github/workflows/deploy-smoke.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compose file is valid
        working-directory: deploy
        run: |
          cp .env.example .env
          docker compose config >/dev/null

      - name: Secrets for the run
        working-directory: deploy
        run: |
          # Throwaway, generated per run: nothing here outlives the job.
          {
            echo "PDNS_API_KEY=$(openssl rand -hex 24)"
            echo "CERTMATE_TOKEN=$(openssl rand -hex 32)"
            echo "MINIO_ROOT_USER=flareover"
            echo "MINIO_ROOT_PASSWORD=$(openssl rand -hex 24)"
            # The runner has systemd-resolved holding 127.0.0.53:53, so
            # publishing DNS on 0.0.0.0 fails to bind — the same collision an
            # operator hits on any Ubuntu host, which is how this knob came to
            # exist. 127.0.0.1 is free there and here.
            echo "DNS_BIND=127.0.0.1"
          } >> .env

      - name: Bring up PowerDNS and MinIO
        working-directory: deploy
        run: docker compose up -d powerdns minio

      # This is the assertion the caveat was standing in for: pdns-init loaded
      # the schema, PowerDNS started against it, and the API answers.
      - name: PowerDNS serves its API on a clean host
        working-directory: deploy
        run: |
          set -a; . ./.env; set +a
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/servers.json -w '%{http_code}' \
              -H "X-API-Key: $PDNS_API_KEY" http://127.0.0.1:8081/api/v1/servers || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          if [ "$code" != "200" ]; then
            echo "::error::PowerDNS API did not answer (last HTTP $code)"
            docker compose logs pdns-init powerdns
            exit 1
          fi
          cat /tmp/servers.json

      # A responding API proves the webserver is up; creating a zone proves the
      # gsqlite3 schema is actually there, which is the part that was in doubt.
      - name: The gsqlite3 schema is usable
        working-directory: deploy
        run: |
          set -a; . ./.env; set +a
          code=$(curl -s -o /tmp/zone.json -w '%{http_code}' -X POST \
            -H "X-API-Key: $PDNS_API_KEY" -H 'Content-Type: application/json' \
            --data '{"name":"smoke.example.","kind":"Native","nameservers":["ns1.smoke.example."]}' \
            http://127.0.0.1:8081/api/v1/servers/localhost/zones)
          if [ "$code" != "201" ]; then
            echo "::error::zone creation returned HTTP $code — the schema is not loaded"
            cat /tmp/zone.json
            docker compose logs pdns-init powerdns
            exit 1
          fi
          curl -sf -H "X-API-Key: $PDNS_API_KEY" \
            http://127.0.0.1:8081/api/v1/servers/localhost/zones | grep -q 'smoke.example'

          # Sign it. The signing key is what the restore assertion below
          # actually needs to compare: a zone that comes back without its
          # original key is a zone whose DS record at the registrar is now
          # wrong, which is the failure the backup exists to prevent.
          curl -sf -X PUT -H "X-API-Key: $PDNS_API_KEY" -H 'Content-Type: application/json' \
            --data '{"dnssec":true}' \
            http://127.0.0.1:8081/api/v1/servers/localhost/zones/smoke.example. 
          curl -sf -H "X-API-Key: $PDNS_API_KEY" \
            http://127.0.0.1:8081/api/v1/servers/localhost/zones/smoke.example./cryptokeys \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)[0]["dnskey"])' > /tmp/dnskey-before
          test -s /tmp/dnskey-before

      # The API must not accept requests from outside the declared subnet: the
      # allow_from setting is the restriction, not the port binding.
      - name: The API refuses a source outside the internal subnet
        working-directory: deploy
        run: |
          set -a; . ./.env; set +a
          code=$(docker run --rm --network host curlimages/curl:8.11.1 -s -o /dev/null -w '%{http_code}' \
            -H "X-API-Key: $PDNS_API_KEY" \
            "http://$(hostname -I | awk '{print $1}'):8081/api/v1/servers" || echo "000")
          # 000 (refused/unreachable, because 8081 publishes on 127.0.0.1 only)
          # and 403 (reached it, allow_from rejected) are both correct. 200 is not.
          if [ "$code" = "200" ]; then
            echo "::error::the PowerDNS API answered a request from outside the internal subnet"
            exit 1
          fi
          echo "refused as expected (HTTP $code)"

      # The backup procedure in deploy/README.md had a documented restore that
      # nothing had ever executed, on the volume holding the DNSSEC signing
      # keys. These steps run it: back up, destroy, restore, and assert the zone
      # survived — which also proves the part most likely to be wrong, that
      # pdns-init leaves a restored database alone instead of treating it as
      # absent.
      - name: Back up pdns-data the way the README says
        working-directory: deploy
        run: |
          mkdir -p backup
          docker compose stop powerdns
          docker run --rm -v flareover_pdns-data:/data -v "$PWD/backup:/backup" alpine             tar czf /backup/pdns-data.tgz -C /data .
          test -s backup/pdns-data.tgz
          docker compose start powerdns

      - name: Destroy and restore, then assert the zone survived
        working-directory: deploy
        run: |
          set -a; . ./.env; set +a
          docker compose down -v
          docker volume create flareover_pdns-data >/dev/null
          docker run --rm -v flareover_pdns-data:/data -v "$PWD/backup:/backup" alpine             tar xzf /backup/pdns-data.tgz -C /data
          docker compose up -d powerdns
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/zones.json -w '%{http_code}'               -H "X-API-Key: $PDNS_API_KEY" http://127.0.0.1:8081/api/v1/servers/localhost/zones || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          if [ "$code" != "200" ]; then
            echo "::error::PowerDNS did not come back after a restore (last HTTP $code)"
            docker compose logs pdns-init powerdns
            exit 1
          fi
          if ! grep -q 'smoke.example' /tmp/zones.json; then
            echo "::error::the restored database does not contain the zone that was backed up"
            cat /tmp/zones.json
            docker compose logs pdns-init
            exit 1
          fi
          # The zone being present is a proxy; the property that matters is the
          # signing key. If it came back different, every resolver validating
          # against the DS record at the registrar would fail — a restore that
          # looks successful and has silently broken the zone.
          curl -sf -H "X-API-Key: $PDNS_API_KEY" \
            http://127.0.0.1:8081/api/v1/servers/localhost/zones/smoke.example./cryptokeys \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)[0]["dnskey"])' > /tmp/dnskey-after
          if ! diff -q /tmp/dnskey-before /tmp/dnskey-after >/dev/null; then
            echo "::error::the zone came back with a DIFFERENT DNSSEC key; the DS record at the registrar would no longer validate"
            echo "before: $(cat /tmp/dnskey-before)"
            echo "after:  $(cat /tmp/dnskey-after)"
            exit 1
          fi
          echo "restored: the zone is there and its DNSSEC signing key is unchanged"

      - name: MinIO answers
        working-directory: deploy
        run: |
          docker compose up -d minio
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/minio/health/live || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          [ "$code" = "200" ] || { echo "::error::MinIO health check returned $code"; exit 1; }

      - name: Logs on failure
        if: failure()
        working-directory: deploy
        run: docker compose logs

      - name: Tear down
        if: always()
        working-directory: deploy
        run: docker compose down -v
