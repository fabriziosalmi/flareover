name: pages

# Deploy docs/ to GitHub Pages via Actions (replaces the built-in
# "deploy from a branch" builder, which has no concurrency control and raced
# itself into a 400 "deployment already in progress" on rapid pushes).
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deploys: never start a second while one is in flight, and don't
# cancel the running one (a half-published site is worse than a short queue).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22 # Astro 7 requires Node >= 22.12
      # Build the Starlight docs site (base: /docs) from website/.
      # This job holds `pages: write` and an OIDC token, and npm install runs
      # lifecycle scripts from every one of ~475 packages. Audit before that
      # happens, and fail the deploy rather than publishing from a tree with a
      # known-vulnerable dependency: `npm ci` is strict about the lockfile, so
      # the only way to clear this is to commit a fixed lockfile.
      - name: Audit docs dependencies
        working-directory: website
        run: npm audit --audit-level=high

      - name: Build docs site
        working-directory: website
        run: |
          npm ci
          npm run build
      # Assemble the deploy artifact: the hand-rolled landing at the root
      # (index.html, assets, CNAME), the Starlight docs mounted at /docs/.
      - name: Assemble site
        run: |
          rm -rf _site && mkdir -p _site
          cp -R docs/. _site/
          mkdir -p _site/docs
          cp -R website/dist/. _site/docs/
      # Rasterize the Open Graph card to PNG (SVG OG images don't render on
      # LinkedIn/Slack). sharp is already installed by the docs build above.
      - name: Rasterize OG image
        run: node website/scripts/rasterize-og.mjs _site/og-image.png
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./_site # root = landing (+ CNAME → www.flareover.com); /docs = Starlight
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
