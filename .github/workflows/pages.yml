name: pages

# Deploy docs/ to GitHub Pages via Actions (replaces the built-in
# "deploy from a branch" builder, which has no concurrency control and raced
# itself into a 400 "deployment already in progress" on rapid pushes).
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deploys: never start a second while one is in flight, and don't
# cancel the running one (a half-published site is worse than a short queue).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22 # Astro 7 requires Node >= 22.12
      # Build the Starlight docs site (base: /docs) from website/.
      # This job holds `pages: write` and an OIDC token, and npm install runs
      # lifecycle scripts from every one of ~475 packages. Audit before that
      # happens, and fail the deploy rather than publishing from a tree with a
      # known-vulnerable dependency: `npm ci` is strict about the lockfile, so
      # the only way to clear this is to commit a fixed lockfile.
      - name: Audit docs dependencies
        working-directory: website
        # moderate, not high. Under pages:write and an OIDC token the axis that
        # matters is not npm's severity rating but that `npm ci` runs install
        # scripts from every one of ~475 packages. If this becomes noisy, accept
        # a specific advisory with a comment naming it rather than raising the
        # threshold for the whole tree.
        run: npm audit --audit-level=moderate

      - name: Build docs site
        working-directory: website
        run: |
          npm ci
          npm run build
      # Assemble the deploy artifact: the hand-rolled landing at the root
      # (index.html, assets, CNAME), the Starlight docs mounted at /docs/.
      - name: Assemble site
        run: |
          rm -rf _site && mkdir -p _site
          cp -R docs/. _site/
          mkdir -p _site/docs
          cp -R website/dist/. _site/docs/
      # Rasterize the Open Graph card to PNG (SVG OG images don't render on
      # LinkedIn/Slack). sharp is already installed by the docs build above.
      - name: Rasterize OG image
        run: node website/scripts/rasterize-og.mjs _site/og-image.png
      # The wiki was converted from hand-copying to generation because it had
      # drifted — after v0.2.0/v0.3.0 its CLI-Reference was missing four flags
      # and described exit codes that had changed. Generation alone does not fix
      # that: it moves the diligence one step, to remembering to run the script.
      # The coverage matrix and the sovereignty tiers are defended by tests that
      # fail on drift; this does the same for the wiki.
      # Two different things were being conflated: "could not check" and
      # "checked, and it has drifted". Both passed, so the drift this exists to
      # catch still reached readers on a green build — the same position the
      # wiki was in before it was made generatable. The clone may genuinely fail
      # from CI, so that stays soft; the drift does not.
      - name: Clone the wiki
        id: wiki
        run: |
          if git clone --depth 1 https://github.com/${{ github.repository }}.wiki.git /tmp/wiki 2>/dev/null; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::wiki not cloneable from CI; skipping the drift check"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: The wiki is in sync with the canonical docs
        if: steps.wiki.outputs.ok == 'true'
        run: |
          node website/scripts/sync-wiki.mjs /tmp/wiki
          if ! git -C /tmp/wiki diff --quiet; then
            echo "::error::the wiki has drifted from website/src/content/docs. Regenerate it:"
            echo "  node website/scripts/sync-wiki.mjs <wiki-clone> && cd <wiki-clone> && git commit -am 'docs: sync' && git push"
            git -C /tmp/wiki diff --stat
            exit 1
          fi

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./_site # root = landing (+ CNAME → www.flareover.com); /docs = Starlight
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
