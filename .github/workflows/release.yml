name: release

# Cut a release by pushing a semver tag:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release + upload assets
  id-token: write # Sigstore keyless signing (cosign OIDC)

# Every action is pinned to a commit SHA, not a tag. A tag is a movable
# reference: whoever controls the action's repository can repoint it, and this
# job holds `contents: write` and the OIDC token cosign signs with — so a moved
# tag here does not break the build, it produces a validly signed malicious
# release, attested by our own provenance machinery. The trailing comment is the
# human-readable version; dependabot (github-actions, weekly) keeps the SHAs
# current, so the maintenance cost is unchanged.

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history + tags for the changelog

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # A tag must not be cut from a toolchain with a known reachable advisory.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

      # The actions are pinned to a SHA, but what they DOWNLOAD was not: each run
      # fetched the current syft and the current cosign, so the SBOM attached to
      # a release was produced by a tool chosen at release time. Same reasoning
      # as the SHAs above, one level down.
      - name: Install syft (SBOM)
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.29.1

      - name: Install cosign (keyless signing)
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.10.1
        with:
          cosign-release: v2.6.1

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty until you add the secret. GoReleaser then skips the Homebrew
          # upload instead of failing (see skip_upload in .goreleaser.yaml).
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
