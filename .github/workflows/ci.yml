name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: staticcheck
        # Pinned, not @latest, so a linter release cannot fail an unrelated PR.
        # Bump it together with the toolchain in go.mod, on purpose: v0.8.x
        # requires go >= 1.26, which is why this moved when go.mod did.
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.0
          staticcheck ./...

      # Zero third-party modules is exactly why this is needed rather than why
      # it is not: the only code that can carry an advisory here is the standard
      # library, and osv-scanner has no go.sum to read. When this was first run
      # it reported eighteen reachable standard-library vulnerabilities against
      # the toolchain then in use, none of which anything in this repository
      # would have surfaced. Pinned for the same reason as staticcheck.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
      - name: test
        run: go test -race ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then echo "gofmt needed on:"; echo "$unformatted"; exit 1; fi
